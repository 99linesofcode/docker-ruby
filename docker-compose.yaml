      service: devcontainer

  mysql:
    extends:
      file: ./base/docker-compose.yaml
      service: mysql

  phpmyadmin:
    extends:
      file: ./base/docker-compose.yaml
      service: phpmyadmin

  redis:
    extends:
      file: ./base/docker-compose.yaml
      service: redis
